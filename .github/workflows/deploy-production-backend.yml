name: deploy-production-backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-production-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install migrate CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz \
            | tar -xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run production database migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing required secret: PRODUCTION_DATABASE_URL"
            exit 1
          fi
          migrate -path backend/migrations -database "$DATABASE_URL" up

      - name: Trigger Render production deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.PRODUCTION_RENDER_SERVICE_ID }}
          DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" >/dev/null
            exit 0
          fi

          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Missing required secret(s): either RENDER_API_KEY+PRODUCTION_RENDER_SERVICE_ID or RENDER_PRODUCTION_DEPLOY_HOOK"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" >/dev/null

      - name: Verify production health
        env:
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
        run: |
          if [ -z "$PRODUCTION_API_BASE_URL" ]; then
            echo "Missing required secret: PRODUCTION_API_BASE_URL"
            exit 1
          fi
          for i in {1..30}; do
            if curl --fail --silent --show-error "$PRODUCTION_API_BASE_URL/api/v1/health/ready" >/dev/null; then
              echo "Production is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Production health verification failed."
          exit 1
