name: deploy-staging-backend

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-staging-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render staging deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Missing required secret: RENDER_STAGING_DEPLOY_HOOK"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"

      - name: Verify staging health
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          if [ -z "$STAGING_API_BASE_URL" ]; then
            echo "Missing required secret: STAGING_API_BASE_URL"
            exit 1
          fi
          curl --fail --silent --show-error "$STAGING_API_BASE_URL/health" >/dev/null
